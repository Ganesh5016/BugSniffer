name: bugsniffer
description: BugSniffer - AI-powered Cybersecurity Platform
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP
  http: ^1.1.0
  
  # Charts
  fl_chart: ^0.66.0
  
  # UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  
  # Utils
  shared_preferences: ^2.2.2
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
